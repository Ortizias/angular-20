<div class="container">
  <h1>{{ title }}</h1>
  <p class="subtitle">Catálogo de productos</p>

  <ul class="product-list">
    @for (product of products; track product.id) {
      <li class="product-card">
        <div class="product-header">
          <span class="product-id">#{{ product.id }}</span>
          <!-- fix(bug-2): currency pipe formatea el precio correctamente -->
          <span class="product-price">{{ product.price | currency:'USD' }}</span>
        </div>

        <h3 class="product-name">{{ product.name }}</h3>
        <p class="product-category">{{ product.category }}</p>

        <!-- fix(bug-3): > 0 excluye stock=0, que debe mostrar 'No disponible' -->
        <span class="badge"
              [class.available]="product.stock > 0"
              [class.unavailable]="product.stock <= 0">
          {{ product.stock > 0 ? 'Disponible' : 'No disponible' }}
        </span>
      </li>
    }
  </ul>
</div>
